server:
  # The MCP server runs on 8080, so the client uses 8081.
  port: 8081

spring:
  application:
    name: spring-mcp-client

  ai:
    # The AI model that reads your question and decides which MCP tools to call.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 2048

    mcp:
      client:
        name: spring-mcp-client
        version: 1.0.0
        type: sync
        request-timeout: 30s
        # Connect to the MCP server over Streamable HTTP (endpoint: /mcp).
        streamable-http:
          connections:
            spring-mcp-server:
              url: ${MCP_SERVER_URL:http://localhost:8080}

mcp:
  server:
    # API key for the server's task tools. Keep it out of this file: set MCP_SERVER_API_KEY.
    api-key: ${MCP_SERVER_API_KEY:}
